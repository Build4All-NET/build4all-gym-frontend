name: Gym App Build Basic

on:
  repository_dispatch:
    types: [owner_app_build]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      CI_CALLBACK_TOKEN: ${{ secrets.CI_CALLBACK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract payload
        run: |
          python3 - <<'PY'
          import json, os
          payload = json.loads(r'''${{ toJson(github.event.client_payload) }}''') or {}
          cfg = payload.get("CONFIG") or {}

          build_id = str(payload.get("BUILD_ID") or payload.get("buildId") or "").strip()
          link_id = str(
              cfg.get("OWNER_PROJECT_LINK_ID")
              or payload.get("OWNER_PROJECT_LINK_ID")
              or payload.get("ownerProjectLinkId")
              or ""
          ).strip()
          api_base = str(cfg.get("API_BASE_URL") or payload.get("API_BASE_URL") or "").strip().rstrip("/")
          app_name = str(cfg.get("APP_NAME") or payload.get("APP_NAME") or "Gym App").strip()

          # Use PACKAGE_NAME sent by backend — this is already unique per app
          package_id = str(
              cfg.get("PACKAGE_NAME") or payload.get("PACKAGE_NAME")
              or cfg.get("APPLICATION_ID") or payload.get("APPLICATION_ID")
              or f"com.build4all.app{link_id}"
          ).strip()

          if not link_id:
              raise SystemExit("Missing OWNER_PROJECT_LINK_ID")
          if not api_base:
              raise SystemExit("Missing API_BASE_URL")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BUILD_ID={build_id}\n")
              f.write(f"LINK_ID={link_id}\n")
              f.write(f"API_BASE={api_base}\n")
              f.write(f"APP_NAME={app_name}\n")
              f.write(f"PACKAGE_ID={package_id}\n")

          print(f"✅ APP_NAME={app_name}")
          print(f"✅ PACKAGE_ID={package_id}")
          PY

      - name: Mark build RUNNING
        if: always()
        run: |
          curl -sS -X PUT "${API_BASE}/api/ci/build-jobs/running" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: ${CI_CALLBACK_TOKEN}" \
            -d "{\"buildId\":\"${BUILD_ID}\",\"linkId\":\"${LINK_ID}\",\"platform\":\"ANDROID\"}" || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Create ci_env.json
        run: |
          mkdir -p lib/env
          python3 - <<'PY'
          import json, os

          env = {
              "API_BASE_URL": os.environ["API_BASE"],
              "OWNER_PROJECT_LINK_ID": os.environ["LINK_ID"],
              "APP_TYPE": "GYM",
              "APP_NAME": os.environ["APP_NAME"],
              "PACKAGE_NAME": os.environ["PACKAGE_ID"],
          }

          with open("lib/env/ci_env.json", "w") as f:
              json.dump(env, f, indent=2)

          print("✅ ci_env.json written:")
          print(json.dumps(env, indent=2))
          PY

      - name: Apply APP_NAME to strings.xml + Manifest
        run: |
          # Fix 1 — strings.xml
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|" "$STRINGS_FILE"
          else
            mkdir -p android/app/src/main/res/values
            cat > "$STRINGS_FILE" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF
          fi
          echo "✅ strings.xml:"
          cat "$STRINGS_FILE"

          # Fix 2 — AndroidManifest.xml android:label (this is what actually shows on phone)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Replace hardcoded label if present
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${APP_NAME}\"|g" "$MANIFEST"
            echo "✅ Manifest label set to: ${APP_NAME}"
            grep "android:label" "$MANIFEST"
          fi

      - name: Apply PACKAGE_ID to build.gradle + Manifest
        run: |
          # Support both Groovy and Kotlin DSL
          if [ -f "android/app/build.gradle.kts" ]; then
            BUILD_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            BUILD_GRADLE="android/app/build.gradle"
          else
            echo "❌ No build.gradle or build.gradle.kts found"
            exit 1
          fi

          echo "=== Using: $BUILD_GRADLE ==="
          grep "applicationId" "$BUILD_GRADLE" || echo "⚠️ No applicationId found"

          if grep -q "flutter.applicationId" "$BUILD_GRADLE"; then
            sed -i "s|applicationId flutter.applicationId|applicationId \"${PACKAGE_ID}\"|" "$BUILD_GRADLE"
          elif grep -q 'applicationId = "' "$BUILD_GRADLE"; then
            sed -i "s|applicationId = \".*\"|applicationId = \"${PACKAGE_ID}\"|" "$BUILD_GRADLE"
          elif grep -q 'applicationId "' "$BUILD_GRADLE"; then
            sed -i "s|applicationId \".*\"|applicationId \"${PACKAGE_ID}\"|" "$BUILD_GRADLE"
          else
            echo "❌ Could not find applicationId — printing full file:"
            cat "$BUILD_GRADLE"
            exit 1
          fi

          echo "✅ applicationId set to: ${PACKAGE_ID}"
          grep "applicationId" "$BUILD_GRADLE"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|package=\"[^\"]*\"|package=\"${PACKAGE_ID}\"|" "$MANIFEST"
            echo "✅ Manifest package set to: ${PACKAGE_ID}"
          fi

      - name: Fix Stripe ProGuard rules
        run: |
          PROGUARD_FILE="android/app/proguard-rules.pro"
          touch "$PROGUARD_FILE"

          if ! grep -q "PushProvisioningActivity" "$PROGUARD_FILE"; then
            cat >> "$PROGUARD_FILE" <<'PROGUARD'
          -keep class com.stripe.android.pushProvisioning.PushProvisioningActivity$g { *; }
          -keep class com.stripe.android.pushProvisioning.PushProvisioningActivityStarter$Args { *; }
          -keep class com.stripe.android.pushProvisioning.PushProvisioningActivityStarter$Error { *; }
          -keep class com.stripe.android.pushProvisioning.PushProvisioningActivityStarter { *; }
          -keep class com.stripe.android.pushProvisioning.PushProvisioningEphemeralKeyProvider { *; }
          -keep class com.stripe.android.pushProvisioning.** { *; }
          -keep class com.reactnativestripesdk.** { *; }
          -dontwarn com.stripe.android.pushProvisioning.**
          -dontwarn com.reactnativestripesdk.**
          PROGUARD
            echo "✅ Stripe ProGuard rules added"
          else
            echo "✅ Stripe ProGuard rules already present"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=lib/env/ci_env.json

      - name: Save APK URL
        if: success()
        run: |
          APK_NAME="gym-app-${LINK_ID}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"

          TAG="gym-build-${LINK_ID}-${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Gym CI build"

          gh release upload "$TAG" "build/app/outputs/flutter-apk/${APK_NAME}" --clobber

          APK_URL="https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${TAG}/${APK_NAME}"

          curl -sS -X PUT "${API_BASE}/api/ci/owner-project-links/${LINK_ID}/apk-url" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: ${CI_CALLBACK_TOKEN}" \
            -d "{\"apkUrl\":\"${APK_URL}\",\"buildId\":\"${BUILD_ID}\"}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report final status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -sS -X PUT "${API_BASE}/api/ci/build-jobs/succeeded" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: ${CI_CALLBACK_TOKEN}" \
              -d "{\"buildId\":\"${BUILD_ID}\",\"linkId\":\"${LINK_ID}\",\"platform\":\"ANDROID\"}" || true
          else
            curl -sS -X PUT "${API_BASE}/api/ci/build-jobs/failed" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: ${CI_CALLBACK_TOKEN}" \
              -d "{\"buildId\":\"${BUILD_ID}\",\"linkId\":\"${LINK_ID}\",\"platform\":\"ANDROID\",\"error\":\"Gym build failed\"}" || true
          fi
